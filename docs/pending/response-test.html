<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaVi Response Formatting Test</title>
    
    <!-- Google Fonts (matching NaVi) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* ============================================
           BASE NAVI VARIABLES & CONTAINER
           ============================================ */
        :root {
            --navi-bg-gradient-from: #1A413D;
            --navi-bg-gradient-via: #1E4744;
            --navi-bg-gradient-to: #224A47;
            --navi-sidebar-bg: #163C38;
            --navi-card-bg: #1A413D;
            --navi-card-bg-darker: #12322F;
            --navi-card-bg-hover: #204946;
            --navi-accent: #4DC8BF;
            --navi-accent-hover: #5AC1BA;
            --navi-accent-muted: #77D5CD;
            --navi-accent-light: #A8E6E1;
            --navi-border: rgba(41, 113, 112, .3);
            --navi-border-light: rgba(41, 113, 112, .5);
            --navi-text-primary: #E8F5F4;
            --navi-text-secondary: #77D5CD;
            --navi-text-muted: rgba(119, 213, 205, .6);
            --navi-text-dark: #163C38;
            --navi-font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --navi-font-mono: "JetBrains Mono", "Fira Code", "Consolas", monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--navi-font-family);
            background: #0a0a0a;
            color: var(--navi-text-primary);
            padding: 2rem;
            line-height: 1.6;
        }

        .test-container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1.page-title {
            color: var(--navi-accent);
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .controls button {
            padding: 0.5rem 1rem;
            background: var(--navi-accent);
            color: var(--navi-text-dark);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            transition: all 0.2s;
        }

        .controls button:hover {
            background: var(--navi-accent-hover);
        }

        .controls button.secondary {
            background: transparent;
            border: 1px solid var(--navi-accent);
            color: var(--navi-accent);
        }

        .controls button.secondary:hover {
            background: var(--navi-accent);
            color: var(--navi-text-dark);
        }

        /* ============================================
           NAVI MESSAGE BUBBLE (simulating widget)
           ============================================ */
        .navi-message-bubble {
            background: linear-gradient(135deg, var(--navi-bg-gradient-from) 0%, var(--navi-bg-gradient-via) 50%, var(--navi-bg-gradient-to) 100%);
            border: 1px solid var(--navi-border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .response-label {
            display: inline-block;
            background: var(--navi-accent);
            color: var(--navi-text-dark);
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }

        /* ============================================
           STREAMING-MARKDOWN CONTENT STYLES
           ============================================ */
        .smd-content {
            font-family: var(--navi-font-family);
            font-size: 0.9375rem;
            line-height: 1.65;
            color: var(--navi-text-primary);
        }

        /* --- Paragraphs --- */
        .smd-content p {
            margin: 0 0 1rem 0;
            line-height: 1.65;
        }

        .smd-content > p:last-child {
            margin-bottom: 0;
        }

        /* --- Headings --- */
        .smd-content h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--navi-accent);
            margin: 1.5rem 0 0.75rem 0;
            line-height: 1.3;
            letter-spacing: -0.01em;
        }

        .smd-content h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--navi-accent);
            margin: 1.5rem 0 0.75rem 0;
            line-height: 1.3;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--navi-border);
        }

        .smd-content h3 {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--navi-accent);
            margin: 1.25rem 0 0.5rem 0;
            line-height: 1.4;
        }

        .smd-content h4 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--navi-text-primary);
            margin: 1rem 0 0.5rem 0;
            line-height: 1.4;
        }

        .smd-content h5,
        .smd-content h6 {
            font-size: 0.9375rem;
            font-weight: 600;
            color: var(--navi-text-primary);
            margin: 0.875rem 0 0.375rem 0;
            line-height: 1.4;
        }

        /* First heading shouldn't have top margin */
        .smd-content > h1:first-child,
        .smd-content > h2:first-child,
        .smd-content > h3:first-child,
        .smd-content > h4:first-child {
            margin-top: 0;
        }

        /* --- Text Emphasis --- */
        .smd-content strong {
            font-weight: 700;
            color: var(--navi-text-primary);
        }

        .smd-content em {
            font-style: italic;
            color: var(--navi-text-secondary);
        }

        /* --- Lists (CRITICAL FIX) --- */
        .smd-content ul {
            list-style-type: disc;
            list-style-position: outside;
            margin: 0.75rem 0;
            padding-left: 1.5rem;
        }

        .smd-content ol {
            list-style-type: decimal;
            list-style-position: outside;
            margin: 0.75rem 0;
            padding-left: 1.5rem;
        }

        .smd-content li {
            display: list-item;
            margin: 0.375rem 0;
            line-height: 1.6;
            padding-left: 0.25rem;
        }

        /* Definition-style list items: **Term**: Description */
        .smd-content li > strong:first-child {
            color: var(--navi-accent);
            font-weight: 600;
        }

        /* Nested lists */
        .smd-content ul ul,
        .smd-content ol ul {
            list-style-type: circle;
            margin: 0.25rem 0 0.5rem 0;
            padding-left: 1.25rem;
        }

        .smd-content ul ul ul,
        .smd-content ol ul ul {
            list-style-type: square;
        }

        .smd-content ul ol,
        .smd-content ol ol {
            margin: 0.25rem 0 0.5rem 0;
            padding-left: 1.25rem;
        }

        /* Paragraphs inside list items */
        .smd-content li p {
            margin: 0;
            display: inline;
        }

        /* --- Blockquotes (Key Takeaways) --- */
        .smd-content blockquote {
            border-left: 4px solid var(--navi-accent);
            background: rgba(77, 200, 191, 0.1);
            margin: 1rem 0;
            padding: 0.75rem 1rem;
            border-radius: 0 8px 8px 0;
        }

        .smd-content blockquote p {
            margin: 0;
            color: var(--navi-text-primary);
        }

        .smd-content blockquote strong {
            color: var(--navi-accent);
        }

        /* --- Horizontal Rules --- */
        .smd-content hr {
            border: none;
            border-top: 1px solid var(--navi-border-light);
            margin: 1.5rem 0;
        }

        /* --- Code --- */
        .smd-content code {
            font-family: var(--navi-font-mono);
            font-size: 0.875em;
            background: rgba(77, 200, 191, 0.15);
            color: var(--navi-accent-light);
            padding: 0.125rem 0.375rem;
            border-radius: 4px;
        }

        .smd-content pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1rem 0;
        }

        .smd-content pre code {
            background: none;
            padding: 0;
            font-size: 0.875rem;
            color: var(--navi-text-primary);
        }

        /* --- Tables --- */
        .smd-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
            font-size: 0.875rem;
        }

        .smd-content th,
        .smd-content td {
            border: 1px solid var(--navi-border);
            padding: 0.5rem 0.75rem;
            text-align: left;
        }

        .smd-content th {
            background: rgba(77, 200, 191, 0.2);
            font-weight: 600;
            color: var(--navi-text-primary);
        }

        .smd-content tr:nth-child(even) {
            background: rgba(0, 0, 0, 0.1);
        }

        /* --- Links --- */
        .smd-content a {
            color: var(--navi-accent);
            text-decoration: underline;
            text-decoration-style: dotted;
            text-underline-offset: 2px;
            transition: all 0.15s ease;
        }

        .smd-content a:hover {
            color: var(--navi-accent-hover);
            text-decoration-style: solid;
        }

        /* --- Citations (superscript) --- */
        .smd-content sup,
        .smd-content .citation-link {
            font-size: 0.7em;
            font-weight: 600;
            color: var(--navi-accent);
            vertical-align: super;
            line-height: 0;
            cursor: pointer;
            padding: 0 0.125rem;
            transition: all 0.15s ease;
        }

        .smd-content sup:hover,
        .smd-content .citation-link:hover {
            color: var(--navi-text-dark);
            background: var(--navi-accent);
            border-radius: 3px;
            padding: 0.125rem 0.25rem;
        }

        /* Citation groups */
        .citation-group {
            display: inline;
            white-space: nowrap;
        }

        /* --- Streaming cursor --- */
        .smd-content.streaming::after {
            content: "▋";
            animation: blink 1s step-end infinite;
            color: var(--navi-accent);
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ============================================
           TEST SECTIONS
           ============================================ */
        .test-section {
            margin-bottom: 3rem;
        }

        .test-section h2 {
            color: var(--navi-text-muted);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px dashed var(--navi-border);
        }

        /* Speed control */
        .speed-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .speed-control label {
            color: var(--navi-text-secondary);
            font-size: 0.875rem;
        }

        .speed-control input[type="range"] {
            width: 150px;
            accent-color: var(--navi-accent);
        }

        .speed-value {
            color: var(--navi-accent);
            font-weight: 600;
            min-width: 50px;
        }

        /* Status indicator */
        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--navi-card-bg-darker);
            border-radius: 6px;
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
        }

        .status-dot.streaming {
            animation: pulse-dot 1.5s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1 class="page-title">NaVi Response Formatting Test</h1>

        <div class="controls">
            <button onclick="streamSampleResponse()">▶ Stream Sample Response</button>
            <button onclick="loadInstantResponse()" class="secondary">⚡ Load Instantly</button>
            <button onclick="clearResponse()" class="secondary">🗑 Clear</button>
            <button onclick="copyCSS()" class="secondary">📋 Copy CSS</button>
        </div>

        <div class="speed-control">
            <label>Stream Speed:</label>
            <input type="range" id="speed" min="1" max="100" value="20">
            <span class="speed-value" id="speedValue">20ms</span>
        </div>

        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Ready</span>
        </div>

        <!-- Test 1: Full Sample Response -->
        <div class="test-section">
            <h2>Streamed Response</h2>
            <div class="navi-message-bubble">
                <span class="response-label">NaVi</span>
                <div class="smd-content" id="response"></div>
            </div>
        </div>

        <!-- Test 2: Individual Elements -->
        <div class="test-section">
            <h2>Element Reference</h2>
            <div class="navi-message-bubble">
                <span class="response-label">Static Examples</span>
                <div class="smd-content" id="static-examples">
                    <!-- Populated on load -->
                </div>
            </div>
        </div>
    </div>

    <!-- Streaming Markdown Library -->
    <script type="module">
        import * as smd from 'https://cdn.jsdelivr.net/npm/streaming-markdown/smd.min.js';

        // Make available globally
        window.smd = smd;

        // Sample response matching NaVi's prompt guidelines
        const sampleMarkdown = `## Defining and Documenting Context of Use for FDA

Defining and documenting the **Context of Use (COU)** for a digital health technology (DHT) is a foundational step to satisfy FDA expectations. The COU acts as a blueprint, specifying how a digital endpoint will be applied in a clinical trial and ensuring it is "fit-for-purpose" <sup>[+]</sup>.

> **Key Requirement**: A precise and well-documented COU helps align stakeholders, guides validation efforts, and is essential for regulatory scrutiny and acceptance.

---

### 1. Elements of a Comprehensive COU

For digital endpoints in clinical trials, the COU typically includes:

- **What is being measured**: The specific clinical event or characteristic (e.g., walking speed, sleep efficiency, arrhythmias, steps per day) <sup>[+]</sup>
- **The population being studied**: This includes specific patient characteristics, participant selection criteria, demographics (age, race, sex, geographic location, health/physical condition), and cultural considerations <sup>[+]</sup>
- **The purpose of the measure**: Whether it is a primary efficacy endpoint, a secondary endpoint, an exploratory biomarker, or used for diagnosis, monitoring, or predicting outcomes
- **How and where data is collected**: This covers:
  - Clinical setting (e.g., inpatient hospital, outpatient clinic, home)
  - Mode of administration (e.g., electronic data capture, paper form)
  - Specific DHTs used (e.g., wrist-worn accelerometer, smartphone microphone)
- **Duration and frequency of measurement**: How long and how often data is collected (e.g., continuous passive monitoring, daily recordings)

### 2. Relationship to MAH and COI

Anchoring the COU to both the **Meaningful Aspect of Health (MAH)** and the **Concept of Interest (COI)** ensures that the endpoint reflects patient priorities:

1. **Meaningful Aspect of Health (MAH)**: An aspect of a disease or health that a patient wants to improve, prevent from worsening, or avoid
2. **Concept of Interest (COI)**: The specific, measurable expression of an MAH (e.g., frequency of night wakings for the MAH of "uninterrupted sleep")

---

### 3. Validation Framework

The **V3+ Framework** provides a structured approach:

| Validation Type | Description | Evidence Required |
|-----------------|-------------|-------------------|
| Verification | Technical accuracy of sensor | Bench testing data |
| Analytical Validation | Algorithm performance | Sensitivity/specificity |
| Clinical Validation | Meaningful in target population | Clinical study data |
| Usability | Feasible in real-world use | User research |

#### a. Technical Verification

Verification establishes that the sensor hardware measures what it claims to measure under controlled conditions.

#### b. Clinical Validation

Clinical validation demonstrates that the digital measure is *clinically meaningful* in the target population for the intended use.

> **Key Point**: Clinical validation should include estimation of the Minimal Clinically Important Difference (MCID).

---

### 4. Best Practices

- Involve patients and clinicians early in defining MAHs and COIs
- Conduct thorough landscape reviews before designing studies
- Document everything clearly for regulatory submissions
- Plan for iterative refinement based on emerging data

For more information, see the FDA guidance on *Digital Health Technologies for Remote Data Acquisition*.`;

        // Static examples for reference
        const staticExamples = `### Heading Levels

## H2 Major Section
### H3 Subsection
#### H4 Sub-subsection

---

### Text Emphasis

This shows **bold for key terms**, *italics for emphasis*, and \`inline code\` for technical terms.

---

### Definition Lists

- **Context of Use (COU)**: A comprehensive statement describing how a medical product development tool is to be used
- **Meaningful Aspect of Health (MAH)**: An aspect of health that patients want to improve or prevent from worsening
- **Concept of Interest (COI)**: The specific, measurable expression of an MAH

---

### Nested Lists

- Primary endpoints
  - Efficacy measures
    - Walking speed
    - Step count
  - Safety measures
- Secondary endpoints
  - Quality of life
  - Patient-reported outcomes

---

### Numbered Steps

1. Define the Concept of Interest
2. Establish Context of Use
3. Select appropriate DHT
4. Validate the measure
5. Implement in trial

---

### Blockquote Callout

> **Key Requirement**: The sDHT must be "fit-for-purpose" for its specific Context of Use (COU).

---

### Citations

This is supported by multiple sources <sup>[+]</sup> and regulatory guidance <sup>[+]</sup>.

---

### Table

| Framework | Focus | Output |
|-----------|-------|--------|
| V3 | Validation | Evidence package |
| PFDD | Patient input | COA selection |
| MDDT | Device tools | Qualified tools |`;

        // Populate static examples immediately
        document.getElementById('static-examples').innerHTML = '';
        const staticRenderer = smd.default_renderer(document.getElementById('static-examples'));
        const staticParser = smd.parser(staticRenderer);
        smd.parser_write(staticParser, staticExamples);
        smd.parser_end(staticParser);

        // Stream sample response
        let streamingParser = null;
        let streamingInterval = null;

        window.streamSampleResponse = function() {
            clearResponse();
            
            const element = document.getElementById('response');
            element.classList.add('streaming');
            
            const renderer = smd.default_renderer(element);
            streamingParser = smd.parser(renderer);
            
            const speed = parseInt(document.getElementById('speed').value);
            let charIndex = 0;
            
            document.getElementById('statusDot').classList.add('streaming');
            document.getElementById('statusText').textContent = 'Streaming...';
            
            streamingInterval = setInterval(() => {
                if (charIndex < sampleMarkdown.length) {
                    // Stream 1-3 characters at a time for realistic effect
                    const chunkSize = Math.floor(Math.random() * 3) + 1;
                    const chunk = sampleMarkdown.slice(charIndex, charIndex + chunkSize);
                    smd.parser_write(streamingParser, chunk);
                    charIndex += chunkSize;
                } else {
                    clearInterval(streamingInterval);
                    smd.parser_end(streamingParser);
                    element.classList.remove('streaming');
                    document.getElementById('statusDot').classList.remove('streaming');
                    document.getElementById('statusText').textContent = 'Complete';
                    postProcessCitations(element);
                }
            }, speed);
        };

        window.loadInstantResponse = function() {
            clearResponse();
            
            const element = document.getElementById('response');
            const renderer = smd.default_renderer(element);
            const parser = smd.parser(renderer);
            
            smd.parser_write(parser, sampleMarkdown);
            smd.parser_end(parser);
            
            document.getElementById('statusText').textContent = 'Loaded';
            postProcessCitations(element);
        };

        window.clearResponse = function() {
            if (streamingInterval) {
                clearInterval(streamingInterval);
            }
            document.getElementById('response').innerHTML = '';
            document.getElementById('response').classList.remove('streaming');
            document.getElementById('statusDot').classList.remove('streaming');
            document.getElementById('statusText').textContent = 'Ready';
        };

        // Post-process citations to make them interactive
        function postProcessCitations(container) {
            const sups = container.querySelectorAll('sup');
            sups.forEach((sup, index) => {
                sup.classList.add('citation-link');
                sup.setAttribute('data-citation', index + 1);
                sup.addEventListener('click', () => {
                    console.log('Citation clicked:', index + 1);
                    // In real implementation, this would open references panel
                });
            });
        }

        // Speed control
        document.getElementById('speed').addEventListener('input', (e) => {
            document.getElementById('speedValue').textContent = e.target.value + 'ms';
        });

        // Copy CSS to clipboard
        window.copyCSS = function() {
            const css = document.querySelector('style').textContent;
            // Extract just the smd-content styles
            const smdStyles = css.match(/\/\* --- Paragraphs ---[\s\S]*?\/\* ============/)?.[0] || css;
            navigator.clipboard.writeText(smdStyles).then(() => {
                alert('CSS copied to clipboard!');
            });
        };
    </script>
</body>
</html>
